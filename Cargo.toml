[package]
name = "revui"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
image = "0.25.10"
portable-pty = "0.9.0"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
vt100 = "0.18.1"
